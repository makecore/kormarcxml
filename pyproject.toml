[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kormarcxml"
version = "0.1.0"
description = "An unofficial, extensible XML processing framework for KORMARC"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["lxml>=6.1,<7"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8", "mypy==2.3.1", "pymarc==5.4.0", "build==1.6.1"]

[project.scripts]
kormarcxml = "kormarcxml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kormarcxml = ["**/*.json", "**/*.xsd", "**/*.xsl", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

